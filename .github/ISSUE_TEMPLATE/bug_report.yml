name: Bug report
description: 报告可复现的问题（请先移除账号和个人信息）
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 请勿上传 Cookie、登录二维码、API Key、AppSecret、数据库、备份或未脱敏日志。安全漏洞请使用 GitHub Security Advisory 私下报告。
  - type: input
    id: version
    attributes:
      label: 版本
      placeholder: 例如 0.21.1
    validations:
      required: true
  - type: dropdown
    id: system
    attributes:
      label: 系统
      options:
        - macOS Apple Silicon
        - Windows x64
        - 源码开发环境
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 使用虚构账号名并对日志、路径和截图脱敏。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果与实际结果
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我已确认内容不含密钥、Cookie、二维码、个人信息和真实用户数据。
          required: true
