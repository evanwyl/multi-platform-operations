name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Quality and security
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: platform/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Verify source
        run: npm run verify
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Generate CycloneDX SBOM
        run: npm sbom --sbom-format cyclonedx > sbom.cdx.json
      - name: Upload SBOM
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: multi-platform-operations-sbom
          path: platform/sbom.cdx.json
          if-no-files-found: error
          retention-days: 14

  windows-package:
    name: Windows x64 portable package
    runs-on: windows-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: platform/package-lock.json
      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: 8.0.425
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright-core install chromium
      - name: Build Windows package
        run: npm run package:windows
      - name: Upload Windows package
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: multi-platform-operations-windows-x64
          path: |
            platform/outputs/*-windows-x64-portable.zip
            platform/outputs/*-windows-x64-portable.zip.sha256
          if-no-files-found: error
          retention-days: 14
